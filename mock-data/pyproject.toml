[project]
name = "dynamic-ui-mock-data"
version = "0.1.0"
description = "Synthetic MCP data server (Streamable-HTTP) backing dynamic-ui demos. No real data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28.1,<2",
    "click>=8.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
